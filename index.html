<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a14">

<title>Number Duel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  background:#070a14;
}

body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  min-height:100vh;
  background:
    radial-gradient(circle at 50% -10%,#202d61 0%,#0d1225 38%,#070a14 72%);
  color:#fff;
  padding:16px;
}

button,input{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.app{
  width:100%;
  max-width:880px;
  margin:auto;
}

.screen{
  display:none;
}

.screen.active{
  display:block;
}

.hero{
  text-align:center;
  padding:30px 10px 22px;
}

.logo{
  font-size:clamp(38px,8vw,68px);
  font-weight:950;
  line-height:1;
  letter-spacing:-3px;
}

.subtitle{
  margin-top:11px;
  color:#9ca8c7;
  font-size:14px;
}

.card{
  background:rgba(15,21,40,.92);
  border:1px solid rgba(255,255,255,.075);
  border-radius:22px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:0 15px 50px rgba(0,0,0,.24);
}

.mode-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:14px;
}

.mode-btn{
  border:1px solid #252d48;
  background:#0c1224;
  color:#fff;
  border-radius:17px;
  min-height:115px;
  padding:18px;
  cursor:pointer;
  text-align:left;
  transition:.16s ease;
}

.mode-btn:active{
  transform:scale(.985);
}

.mode-btn.selected{
  border-color:#7481ff;
  background:linear-gradient(145deg,#202a58,#151d3d);
  box-shadow:0 0 0 2px rgba(116,129,255,.13);
}

.mode-icon{
  font-size:29px;
  margin-bottom:7px;
}

.mode-title{
  font-size:18px;
  font-weight:850;
}

.mode-description{
  color:#8e99b7;
  font-size:12px;
  margin-top:4px;
}

.button-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

button.primary,
button.secondary{
  border:0;
  border-radius:13px;
  padding:14px 17px;
  font-weight:850;
  cursor:pointer;
  transition:.15s ease;
}

button.primary{
  color:#fff;
  background:#6574ff;
}

button.primary:hover{
  background:#7482ff;
}

button.secondary{
  color:#fff;
  background:#242c45;
}

button.secondary:hover{
  background:#303953;
}

button:active{
  transform:scale(.985);
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
  transform:none!important;
}

input{
  width:100%;
  border:1px solid #2d3653;
  border-radius:12px;
  background:#080d1b;
  color:#fff;
  padding:13px 14px;
  outline:none;
  margin-top:7px;
}

input:focus{
  border-color:#7080ff;
  box-shadow:0 0 0 3px rgba(112,128,255,.08);
}

label{
  display:block;
  color:#bdc6dd;
  font-size:13px;
  font-weight:750;
}

.hidden{
  display:none!important;
}

.error-box{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  border:1px solid rgba(255,85,105,.34);
  background:rgba(255,65,85,.09);
  color:#ffb0ba;
  font-size:12px;
  line-height:1.5;
  word-break:break-word;
}

.error-title{
  color:#ff7e8c;
  font-weight:900;
  margin-bottom:3px;
}

.success-box{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  border:1px solid rgba(63,220,139,.25);
  background:rgba(63,220,139,.08);
  color:#91edb9;
  font-size:13px;
}

.room-code{
  text-align:center;
  font-size:clamp(30px,8vw,42px);
  font-weight:950;
  letter-spacing:8px;
  background:#080d1b;
  border-radius:15px;
  padding:17px 10px;
  margin:10px 0;
}

.room-info{
  text-align:center;
  color:#8f9ab7;
  font-size:12px;
  letter-spacing:.8px;
}

.loading{
  text-align:center;
  padding:13px;
  color:#9ba6c2;
  font-size:13px;
}

.game-header{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:10px;
  align-items:center;
  margin-bottom:14px;
}

.player-score{
  background:#11172b;
  border:1px solid rgba(255,255,255,.06);
  border-radius:16px;
  padding:13px;
}

.player-score.right{
  text-align:right;
}

.player-name{
  color:#8994b1;
  text-transform:uppercase;
  letter-spacing:1px;
  font-size:10px;
  font-weight:750;
}

.score{
  font-size:28px;
  font-weight:950;
  line-height:1.1;
  margin-top:3px;
}

.round-label{
  text-align:center;
  background:#1c2449;
  border-radius:13px;
  padding:9px 13px;
  min-width:92px;
}

.round-small{
  color:#929dc0;
  font-size:9px;
  letter-spacing:1px;
}

.round-number{
  font-size:19px;
  font-weight:900;
}

.status{
  text-align:center;
  font-size:17px;
  font-weight:850;
  margin-bottom:15px;
}

.secret-box{
  text-align:center;
  background:#080d1b;
  border-radius:16px;
  padding:17px;
}

.secret-title{
  color:#9da8c4;
  font-size:12px;
  margin-bottom:8px;
}

.guess-form{
  display:flex;
  gap:8px;
  margin-top:8px;
}

.guess-form input{
  margin:0;
}

.guess-form button{
  min-width:110px;
}

.history{
  margin-top:17px;
}

.history-title{
  color:#8f9ab7;
  font-size:11px;
  font-weight:800;
  letter-spacing:1px;
  text-transform:uppercase;
  margin-bottom:8px;
}

.guess-item{
  background:#0a1020;
  border:1px solid rgba(255,255,255,.055);
  border-radius:12px;
  padding:11px;
  margin-bottom:7px;
}

.guess-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-weight:800;
}

.guess-result{
  color:#9ca7c1;
  font-size:12px;
  margin-top:4px;
}

.feedback-list{
  display:grid;
  gap:5px;
  margin-top:8px;
}

.feedback-digit{
  border-radius:8px;
  padding:7px 9px;
  font-size:12px;
  font-weight:700;
}

.correct-position{
  background:rgba(62,215,133,.10);
  color:#81e9ad;
}

.wrong-position{
  background:rgba(244,189,54,.10);
  color:#ffd16a;
}

.not-found{
  background:rgba(255,75,90,.08);
  color:#ff9da7;
}

.result-box,
.winner-box{
  text-align:center;
  border-radius:17px;
  padding:23px 16px;
  margin-top:15px;
  background:#151d38;
  border:1px solid rgba(255,255,255,.055);
}

.result-title,
.winner-title{
  font-size:24px;
  font-weight:950;
}

.result-points{
  color:#9ca7c2;
  margin-top:7px;
  font-size:13px;
}

.winner-score{
  font-size:38px;
  font-weight:950;
  margin-top:7px;
}

.small-note{
  color:#818ca8;
  font-size:11px;
  line-height:1.5;
  margin-top:9px;
}

@media(max-width:600px){

  body{
    padding:10px;
  }

  .hero{
    padding-top:25px;
  }

  .mode-grid,
  .button-row{
    grid-template-columns:1fr;
  }

  .game-header{
    grid-template-columns:1fr 1fr;
  }

  .round-label{
    grid-column:1 / -1;
    grid-row:1;
    width:100%;
  }

  .player-score{
    grid-row:2;
  }

  .player-score.right{
    text-align:right;
  }

  .guess-form{
    flex-direction:column;
  }

  .guess-form button{
    width:100%;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- HOME -->

<section id="homeScreen" class="screen active">

  <div class="hero">
    <div class="logo">NUMBER DUEL</div>

    <div class="subtitle">
      Think fast. Guess smart. Win the duel.
    </div>
  </div>


  <div class="card">

    <div class="mode-grid">

      <button
        id="duelModeBtn"
        class="mode-btn selected"
        type="button">

        <div class="mode-icon">🎯</div>

        <div class="mode-title">
          Duel
        </div>

        <div class="mode-description">
          Guess a number from 1–100
        </div>

      </button>


      <button
        id="crackModeBtn"
        class="mode-btn"
        type="button">

        <div class="mode-icon">🔐</div>

        <div class="mode-title">
          Crack
        </div>

        <div class="mode-description">
          Crack a unique 4-digit code
        </div>

      </button>

    </div>


    <div class="button-row">

      <button
        id="createRoomBtn"
        class="primary"
        type="button">

        Create Room

      </button>


      <button
        id="showJoinBtn"
        class="secondary"
        type="button">

        Join Room

      </button>

    </div>


    <div id="homeError"></div>

  </div>


  <div
    id="joinCard"
    class="card hidden">

    <label for="joinCodeInput">
      Room Code
    </label>

    <input
      id="joinCodeInput"
      maxlength="6"
      autocomplete="off"
      autocapitalize="characters"
      spellcheck="false"
      placeholder="ABC123">

    <button
      id="joinRoomBtn"
      class="primary"
      type="button"
      style="width:100%;margin-top:10px">

      Join Room

    </button>

    <div id="joinError"></div>

  </div>

</section>


<!-- WAITING -->

<section id="waitingScreen" class="screen">

  <div class="hero">

    <div
      class="logo"
      style="font-size:44px">

      ROOM READY

    </div>

    <div class="subtitle">
      Share the code with your opponent
    </div>

  </div>


  <div class="card">

    <div class="room-info">
      ROOM CODE
    </div>

    <div
      id="createdRoomCode"
      class="room-code">

      ------

    </div>

    <div
      id="waitingStatus"
      class="loading">

      Waiting for opponent…

    </div>

    <button
      id="cancelRoomBtn"
      class="secondary"
      type="button"
      style="width:100%">

      Leave Room

    </button>

  </div>


  <div id="waitingError"></div>

</section>


<!-- GAME -->

<section id="gameScreen" class="screen">

  <div
    class="hero"
    style="padding-bottom:15px">

    <div
      class="logo"
      style="font-size:42px">

      NUMBER DUEL

    </div>

    <div class="subtitle">
      Room <span id="gameRoomCode"></span>
    </div>

  </div>


  <div class="game-header">

    <div class="player-score">

      <div class="player-name">
        You
      </div>

      <div
        id="myScore"
        class="score">

        0

      </div>

    </div>


    <div class="round-label">

      <div class="round-small">
        ROUND
      </div>

      <div class="round-number">

        <span id="roundNumber">
          1
        </span>/3

      </div>

    </div>


    <div class="player-score right">

      <div class="player-name">
        Opponent
      </div>

      <div
        id="opponentScore"
        class="score">

        0

      </div>

    </div>

  </div>


  <div class="card">

    <div
      id="gameStatus"
      class="status">

      Loading…

    </div>


    <!-- SECRET -->

    <div id="secretSection">

      <div class="secret-box">

        <div
          id="secretInstruction"
          class="secret-title">

          Choose your secret number

        </div>


        <input
          id="secretInput"
          autocomplete="off"
          inputmode="numeric"
          maxlength="3"
          placeholder="1–100">


        <button
          id="setSecretBtn"
          class="primary"
          type="button"
          style="width:100%;margin-top:10px">

          Set Secret

        </button>


        <div id="secretMessage"></div>

      </div>

    </div>


    <!-- GUESS -->

    <div
      id="guessSection"
      class="hidden">

      <div class="secret-box">

        <div
          id="guessInstruction"
          class="secret-title">

          Guess opponent's number

        </div>


        <div class="guess-form">

          <input
            id="guessInput"
            autocomplete="off"
            inputmode="numeric"
            maxlength="3"
            placeholder="Your guess">


          <button
            id="guessBtn"
            class="primary"
            type="button">

            Guess

          </button>

        </div>


        <div id="guessError"></div>

      </div>


      <div class="history">

        <div class="history-title">
          Your Guess History
        </div>

        <div id="guessHistory"></div>

      </div>

    </div>


    <div id="roundResult"></div>

    <div id="finalResult"></div>

  </div>


  <button
    id="leaveGameBtn"
    class="secondary"
    type="button"
    style="width:100%">

    Leave Game

  </button>

</section>

</div>


<script>

/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
  "https://uenyqkyuyxbbqehjzspk.supabase.co";


/*
 IMPORTANT:
 Replace this with your existing
 Supabase anon/publishable key.
*/

const SUPABASE_KEY =
  "sb_publishable_FGT-Tw77u5BTy4zxbqwiHA_bmndBToE";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   CONFIG
========================================================= */

const TOTAL_ROUNDS = 3;

const MAX_POINTS = 100;

const MIN_POINTS = 10;


/* =========================================================
   VARIABLES
========================================================= */

let selectedMode = "duel";

let roomCode = "";

let myRole = "";

let currentState = null;

let realtimeChannel = null;

let nextRoundTimer = null;

let transitionKey = "";


/* =========================================================
   DOM HELPER
========================================================= */

const $ = id =>
  document.getElementById(id);


/* =========================================================
   SCREEN
========================================================= */

function showScreen(screen){

  document
    .querySelectorAll(".screen")
    .forEach(element =>
      element.classList.remove("active")
    );

  screen.classList.add("active");
}


/* =========================================================
   ERROR HANDLING
========================================================= */

function clearError(element){

  if(element)
    element.innerHTML = "";
}


function showError(
  element,
  error,
  title = "Error"
){

  if(!element)
    return;


  let message =
    "Unknown error.";


  if(typeof error === "string"){

    message =
      escapeHtml(error);

  }else if(error){

    const parts = [];


    if(error.message){

      parts.push(
        `Message: ${escapeHtml(
          error.message
        )}`
      );
    }


    if(error.details){

      parts.push(
        `Details: ${escapeHtml(
          error.details
        )}`
      );
    }


    if(error.hint){

      parts.push(
        `Hint: ${escapeHtml(
          error.hint
        )}`
      );
    }


    if(error.code){

      parts.push(
        `Code: ${escapeHtml(
          error.code
        )}`
      );
    }


    message =
      parts.length
        ? parts.join("<br>")
        : escapeHtml(
            JSON.stringify(error)
          );
  }


  element.innerHTML = `
    <div class="error-box">

      <div class="error-title">
        ⚠️ ${escapeHtml(title)}
      </div>

      ${message}

    </div>
  `;
}


function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =========================================================
   ROOM CODE
========================================================= */

function generateRoomCode(){

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let code = "";


  for(
    let i = 0;
    i < 6;
    i++
  ){

    code +=
      chars[
        Math.floor(
          Math.random() *
          chars.length
        )
      ];
  }


  return code;
}


/* =========================================================
   PLAYER STATE
========================================================= */

function playerState(){

  return {

    joined:false,

    secret:null,

    secretSet:false,

    guesses:[],

    roundPoints:0,

    totalPoints:0

  };
}


/* =========================================================
   INITIAL STATE
========================================================= */

function initialState(mode){

  return {

    mode,

    status:
      "waiting_for_join",

    round:1,

    totalRounds:
      TOTAL_ROUNDS,

    turn:"a",

    winner:null,

    roundWinner:null,

    roundFinished:false,

    a:
      playerState(),

    b:
      playerState()

  };
}


/* =========================================================
   NORMALIZE STATE
========================================================= */

function normalizePlayer(player){

  return {

    joined:
      !!player?.joined,

    secret:
      player?.secret ?? null,

    secretSet:
      !!player?.secretSet,

    guesses:
      Array.isArray(
        player?.guesses
      )
        ? player.guesses
        : [],

    roundPoints:
      Number(
        player?.roundPoints || 0
      ),

    totalPoints:
      Number(
        player?.totalPoints || 0
      )

  };
}


function normalizeState(state){

  state =
    state ||
    initialState("duel");


  state.a =
    normalizePlayer(
      state.a
    );


  state.b =
    normalizePlayer(
      state.b
    );


  state.round =
    Number(
      state.round || 1
    );


  state.totalRounds =
    Number(
      state.totalRounds ||
      TOTAL_ROUNDS
    );


  state.turn =
    state.turn ||
    "a";


  state.roundFinished =
    !!state.roundFinished;


  return state;
}


/* =========================================================
   POINTS
========================================================= */

function pointsForGuess(count){

  return Math.max(
    MIN_POINTS,
    MAX_POINTS -
      ((count - 1) * 10)
  );
}


/* =========================================================
   MODE SELECTION
========================================================= */

$("duelModeBtn")
.addEventListener(
  "click",
  () => {

    selectedMode =
      "duel";


    $("duelModeBtn")
      .classList.add(
        "selected"
      );


    $("crackModeBtn")
      .classList.remove(
        "selected"
      );


    updateInputMode();
  }
);


$("crackModeBtn")
.addEventListener(
  "click",
  () => {

    selectedMode =
      "crack";


    $("crackModeBtn")
      .classList.add(
        "selected"
      );


    $("duelModeBtn")
      .classList.remove(
        "selected"
      );


    updateInputMode();
  }
);


/* =========================================================
   JOIN UI
========================================================= */

$("showJoinBtn")
.addEventListener(
  "click",
  () => {

    clearError(
      $("homeError")
    );


    $("joinCard")
      .classList.toggle(
        "hidden"
      );
  }
);


/* =========================================================
   CREATE ROOM
========================================================= */

$("createRoomBtn")
.addEventListener(
  "click",
  createRoom
);


async function createRoom(){

  clearError(
    $("homeError")
  );


  const button =
    $("createRoomBtn");


  if(button.disabled)
    return;


  if(
    !SUPABASE_KEY ||
    SUPABASE_KEY ===
      "YOUR_SUPABASE_ANON_KEY"
  ){

    showError(
      $("homeError"),
      "Paste your existing Supabase anon/publishable key into SUPABASE_KEY.",
      "Supabase Key Missing"
    );

    return;
  }


  button.disabled =
    true;


  button.textContent =
    "Creating…";


  try{

    /*
      One database request.
    */

    let code =
      generateRoomCode();


    const state =
      initialState(
        selectedMode
      );


    let result =
      await supabaseClient
        .from("duels")
        .insert({
          code,
          state,
          updated_at:
            new Date()
              .toISOString()
        })
        .select()
        .single();


    /*
      Retry only on duplicate code.
    */

    if(
      result.error &&
      (
        result.error.code ===
          "23505" ||
        result.error.message
          ?.toLowerCase()
          .includes("duplicate")
      )
    ){

      code =
        generateRoomCode();


      result =
        await supabaseClient
          .from("duels")
          .insert({
            code,
            state,
            updated_at:
              new Date()
                .toISOString()
          })
          .select()
          .single();
    }


    if(result.error)
      throw result.error;


    roomCode =
      code;


    myRole =
      "a";


    currentState =
      normalizeState(
        result.data.state
      );


    $("createdRoomCode")
      .textContent =
      roomCode;


    $("waitingStatus")
      .textContent =
      "Waiting for opponent…";


    showScreen(
      $("waitingScreen")
    );


    subscribeToRoom();


  }catch(error){

    console.error(
      "CREATE ROOM ERROR:",
      error
    );


    showError(
      $("homeError"),
      error,
      "Could not create room"
    );


  }finally{

    button.disabled =
      false;


    button.textContent =
      "Create Room";
  }
}


/* =========================================================
   JOIN ROOM
========================================================= */

$("joinRoomBtn")
.addEventListener(
  "click",
  joinRoom
);


async function joinRoom(){

  clearError(
    $("joinError")
  );


  const button =
    $("joinRoomBtn");


  const code =
    $("joinCodeInput")
      .value
      .trim()
      .toUpperCase();


  if(
    !/^[A-Z0-9]{6}$/
      .test(code)
  ){

    showError(
      $("joinError"),
      "Enter a valid 6-character room code.",
      "Invalid Room Code"
    );

    return;
  }


  if(button.disabled)
    return;


  button.disabled =
    true;


  button.textContent =
    "Joining…";


  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from("duels")
        .select("*")
        .eq("code",code)
        .maybeSingle();


    if(error)
      throw error;


    if(!data){

      throw new Error(
        "Room not found. Check the code and try again."
      );
    }


    const state =
      normalizeState(
        data.state
      );


    if(state.b.joined){

      throw new Error(
        "This room already has two players."
      );
    }


    state.b.joined =
      true;


    state.status =
      "playing";


    const {
      data:updated,
      error:updateError
    } =
      await supabaseClient
        .from("duels")
        .update({
          state,
          updated_at:
            new Date()
              .toISOString()
        })
        .eq("code",code)
        .select()
        .single();


    if(updateError)
      throw updateError;


    roomCode =
      code;


    myRole =
      "b";


    currentState =
      normalizeState(
        updated.state
      );


    $("gameRoomCode")
      .textContent =
      roomCode;


    showScreen(
      $("gameScreen")
    );


    subscribeToRoom();

    renderGame();


  }catch(error){

    console.error(
      "JOIN ROOM ERROR:",
      error
    );


    showError(
      $("joinError"),
      error,
      "Could not join room"
    );


  }finally{

    button.disabled =
      false;


    button.textContent =
      "Join Room";
  }
}


/* =========================================================
   REALTIME
========================================================= */

function subscribeToRoom(){

  if(realtimeChannel){

    supabaseClient
      .removeChannel(
        realtimeChannel
      );
  }


  realtimeChannel =
    supabaseClient
      .channel(
        `room-${roomCode}`
      )
      .on(
        "postgres_changes",
        {
          event:"UPDATE",
          schema:"public",
          table:"duels",
          filter:
            `code=eq.${roomCode}`
        },
        payload => {

          if(
            payload.new &&
            payload.new.state
          ){

            currentState =
              normalizeState(
                payload.new.state
              );


            if(
              currentState.status ===
              "playing"
            ){

              $("gameRoomCode")
                .textContent =
                roomCode;


              showScreen(
                $("gameScreen")
              );


              renderGame();

            }else{

              renderWaiting();
            }
          }
        }
      )
      .subscribe(
        status => {

          console.log(
            "Realtime:",
            status
          );


          if(
            status ===
            "CHANNEL_ERROR"
          ){

            showError(
              $("waitingError"),
              "Realtime connection failed. Make sure the duels table is enabled in Supabase Realtime.",
              "Realtime Error"
            );
          }
        }
      );
}

/* =========================================================
   SECRET
========================================================= */

$("setSecretBtn")
.addEventListener(
  "click",
  setSecret
);


async function setSecret(){

  clearError(
    $("secretMessage")
  );


  const value =
    $("secretInput")
      .value
      .trim();


  const player =
    currentState[
      myRole
    ];


  if(player.secretSet){

    showError(
      $("secretMessage"),
      "Your secret is already locked for this round.",
      "Already Set"
    );

    return;
  }


  if(
    !validateSecret(value)
  )
    return;


  player.secret =
    value;


  player.secretSet =
    true;


  if(
    currentState.a.secretSet &&
    currentState.b.secretSet
  ){

    currentState.status =
      "playing";


    currentState.turn =
      "a";
  }


  await saveState();
}


function validateSecret(value){

  if(
    currentState.mode ===
    "duel"
  ){

    if(
      !/^\d+$/.test(value)
    ){

      showError(
        $("secretMessage"),
        "Enter a whole number from 1 to 100.",
        "Invalid Secret"
      );

      return false;
    }


    const number =
      Number(value);


    if(
      number < 1 ||
      number > 100
    ){

      showError(
        $("secretMessage"),
        "Enter a whole number from 1 to 100.",
        "Invalid Secret"
      );

      return false;
    }


    return true;
  }


  if(
    !/^\d{4}$/.test(value)
  ){

    showError(
      $("secretMessage"),
      "Crack requires exactly 4 digits.",
      "Invalid Secret"
    );

    return false;
  }


  if(
    new Set(
      value.split("")
    ).size !== 4
  ){

    showError(
      $("secretMessage"),
      "All 4 digits must be different.",
      "Invalid Secret"
    );

    return false;
  }


  return true;
}


/* =========================================================
   GUESS
========================================================= */

$("guessBtn")
.addEventListener(
  "click",
  makeGuess
);


async function makeGuess(){

  clearError(
    $("guessError")
  );


  if(!currentState)
    return;


  if(
    currentState.roundFinished
  )
    return;


  if(
    currentState.turn !==
    myRole
  ){

    showError(
      $("guessError"),
      "Wait for your turn.",
      "Not Your Turn"
    );

    return;
  }


  const value =
    $("guessInput")
      .value
      .trim();


  if(
    !validateGuess(value)
  )
    return;


  const mine =
    currentState[
      myRole
    ];


  const opponentRole =
    myRole === "a"
      ? "b"
      : "a";


  const opponent =
    currentState[
      opponentRole
    ];


  if(
    mine.guesses.some(
      guess =>
        guess.value ===
        value
    )
  ){

    showError(
      $("guessError"),
      "You already tried this guess.",
      "Duplicate Guess"
    );

    return;
  }


  /* DUEL */

  if(
    currentState.mode ===
    "duel"
  ){

    mine.guesses.push({
      value
    });


    const guess =
      Number(value);


    const secret =
      Number(
        opponent.secret
      );


    if(
      guess === secret
    ){

      const points =
        pointsForGuess(
          mine.guesses.length
        );


      mine.roundPoints =
        points;


      mine.totalPoints +=
        points;


      currentState.roundWinner =
        myRole;


      currentState.roundFinished =
        true;

    }else{

      currentState.turn =
        opponentRole;
    }


  }else{

    /* CRACK */

    const result =
      scoreCrack(
        value,
        opponent.secret
      );


    mine.guesses.push({

      value,

      bulls:
        result.bulls,

      cows:
        result.cows,

      details:
        result.details

    });


    if(
      result.bulls === 4
    ){

      const points =
        pointsForGuess(
          mine.guesses.length
        );


      mine.roundPoints =
        points;


      mine.totalPoints +=
        points;


      currentState.roundWinner =
        myRole;


      currentState.roundFinished =
        true;

    }else{

      currentState.turn =
        opponentRole;
    }
  }


  $("guessInput")
    .value = "";


  await saveState();
}


/* =========================================================
   GUESS VALIDATION
========================================================= */

function validateGuess(value){

  if(
    currentState.mode ===
    "duel"
  ){

    if(
      !/^\d+$/.test(value)
    ){

      showError(
        $("guessError"),
        "Enter a whole number from 1 to 100.",
        "Invalid Guess"
      );

      return false;
    }


    const number =
      Number(value);


    if(
      number < 1 ||
      number > 100
    ){

      showError(
        $("guessError"),
        "Your guess must be between 1 and 100.",
        "Invalid Guess"
      );

      return false;
    }


    return true;
  }


  if(
    !/^\d{4}$/.test(value)
  ){

    showError(
      $("guessError"),
      "Enter exactly 4 digits.",
      "Invalid Guess"
    );

    return false;
  }


  if(
    new Set(
      value.split("")
    ).size !== 4
  ){

    showError(
      $("guessError"),
      "All 4 digits must be different.",
      "Invalid Guess"
    );

    return false;
  }


  return true;
}


/* =========================================================
   CRACK
========================================================= */

function scoreCrack(
  guess,
  secret
){

  let bulls = 0;

  let cows = 0;

  const details = [];


  for(
    let i = 0;
    i < 4;
    i++
  ){

    const digit =
      guess[i];


    if(
      digit ===
      secret[i]
    ){

      bulls++;


      details.push({

        digit,

        position:
          i + 1,

        status:
          "correct-position"

      });

    }else if(
      secret.includes(
        digit
      )
    ){

      cows++;


      details.push({

        digit,

        position:
          i + 1,

        status:
          "correct-wrong-position"

      });

    }else{

      details.push({

        digit,

        position:
          i + 1,

        status:
          "not-in-code"

      });
    }
  }


  return {
    bulls,
    cows,
    details
  };
}

   RENDER GAME
========================================================= */

function renderGame(){

  if(!currentState)
    return;


  currentState =
    normalizeState(
      currentState
    );


  $("gameRoomCode")
    .textContent =
    roomCode;


  $("roundNumber")
    .textContent =
    currentState.round;


  const mine =
    currentState[
      myRole
    ];


  const opponent =
    currentState[
      myRole === "a"
        ? "b"
        : "a"
    ];


  $("myScore")
    .textContent =
    mine.totalPoints;


  $("opponentScore")
    .textContent =
    opponent.totalPoints;


  /* FINAL */

  if(
    currentState.winner
  ){

    $("secretSection")
      .classList.add(
        "hidden"
      );


    $("guessSection")
      .classList.add(
        "hidden"
      );


    renderFinal();

    return;
  }


  /* ROUND FINISHED */

  if(
    currentState.roundFinished
  ){

    $("secretSection")
      .classList.add(
        "hidden"
      );


    $("guessSection")
      .classList.add(
        "hidden"
      );


    renderRoundResult();


    scheduleNextRound();


    return;
  }


  /* WAITING FOR SECRET */

  if(
    !currentState.a.secretSet ||
    !currentState.b.secretSet
  ){

    $("guessSection")
      .classList.add(
        "hidden"
      );


    $("secretSection")
      .classList.remove(
        "hidden"
      );


    $("secretInstruction")
      .textContent =
      currentState.mode ===
      "duel"
        ? "Choose your secret number"
        : "Choose your secret 4-digit code";


    if(mine.secretSet){

      $("secretInput")
        .disabled = true;


      $("setSecretBtn")
        .disabled = true;


      $("gameStatus")
        .textContent =
        "✓ Secret saved. Waiting for opponent…";


      $("secretMessage")
        .innerHTML = `
          <div class="success-box">
            ✓ Your secret is locked in.
          </div>
        `;

    }else{

      $("secretInput")
        .disabled = false;


      $("setSecretBtn")
        .disabled = false;


      $("gameStatus")
        .textContent =
        "Set your secret to start the round.";
    }


    return;
  }


  /* BOTH READY */

  $("secretSection")
    .classList.add(
      "hidden"
    );


  $("guessSection")
    .classList.remove(
      "hidden"
    );


  $("guessInstruction")
    .textContent =
    currentState.mode ===
    "duel"
      ? "Guess opponent's number (1–100)"
      : "Crack opponent's 4-digit code";


  if(
    currentState.turn ===
    myRole
  ){

    $("gameStatus")
      .textContent =
      "🔥 Your turn";


    $("guessInput")
      .disabled = false;


    $("guessBtn")
      .disabled = false;

  }else{

    $("gameStatus")
      .textContent =
      "⏳ Opponent's turn";


    $("guessInput")
      .disabled = true;


    $("guessBtn")
      .disabled = true;
  }


  /*
    Only YOUR guesses are shown.
  */

  renderHistory(
    $("guessHistory"),
    mine.guesses
  );
}


/* =========================================================
   HISTORY
========================================================= */

function renderHistory(
  container,
  guesses
){

  if(!guesses.length){

    container.innerHTML = `
      <div class="small-note">
        Your guesses will appear here.
      </div>
    `;

    return;
  }


  const opponentRole =
    myRole === "a"
      ? "b"
      : "a";


  const secret =
    currentState[
      opponentRole
    ].secret;


  container.innerHTML =
    guesses
      .slice()
      .reverse()
      .map(
        (guess,index) => {

          /* =========================
             DUEL
          ========================= */

          if(
            currentState.mode ===
            "duel"
          ){

            const value =
              Number(
                guess.value
              );


            const target =
              Number(secret);


            let result;


            /*
              IMPORTANT:
              Lower number = tell user "Upper"
              Higher number = tell user "Lower"
            */

            if(
              value < target
            ){

              result =
                "⬆️ Upper";

            }else if(
              value > target
            ){

              result =
                "⬇️ Lower";

            }else{

              result =
                "🎯 Correct";
            }


            return `
              <div class="guess-item">

                <div class="guess-top">

                  <span>
                    Guess ${
                      guesses.length -
                      index
                    }
                  </span>

                  <strong>
                    ${escapeHtml(
                      guess.value
                    )}
                  </strong>

                </div>


                <div class="guess-result">
                  ${result}
                </div>

              </div>
            `;
          }


          /* =========================
             CRACK
          ========================= */

          const details =
            Array.isArray(
              guess.details
            )
              ? guess.details
              : [];


          return `
            <div class="guess-item">

              <div class="guess-top">

                <span>
                  Guess ${
                    guesses.length -
                    index
                  }
                </span>

                <strong>
                  ${escapeHtml(
                    guess.value
                  )}
                </strong>

              </div>


              <div class="guess-result">

                ${guess.bulls}
                correct position

                •

                ${guess.cows}
                correct digit, wrong position

              </div>


              <div class="feedback-list">

                ${
                  details
                    .map(
                      item => {

                        if(
                          item.status ===
                          "correct-position"
                        ){

                          return `
                            <div class="feedback-digit correct-position">

                              ${escapeHtml(
                                item.digit
                              )}

                              ✓ Correct digit
                              •
                              Correct position

                            </div>
                          `;
                        }


                        if(
                          item.status ===
                          "correct-wrong-position"
                        ){

                          return `
                            <div class="feedback-digit wrong-position">

                              ${escapeHtml(
                                item.digit
                              )}

                              ✓ Correct digit
                              •
                              Wrong position

                            </div>
                          `;
                        }


                        return `
                          <div class="feedback-digit not-found">

                            ${escapeHtml(
                              item.digit
                            )}

                            ✕ Not in code

                          </div>
                        `;
                      }
                    )
                    .join("")
                }

              </div>

            </div>
          `;
        }
      )
      .join("");
}

/* =========================================================
   NEXT ROUND
========================================================= */

function scheduleNextRound(){

  const key =
    `${currentState.round}:${currentState.roundWinner}`;


  if(
    transitionKey ===
    key
  )
    return;


  transitionKey =
    key;


  if(nextRoundTimer){

    clearTimeout(
      nextRoundTimer
    );
  }


  nextRoundTimer =
    setTimeout(
      startNextRound,
      2500
    );
}


async function startNextRound(){

  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from("duels")
        .select("*")
        .eq(
          "code",
          roomCode
        )
        .maybeSingle();


    if(error)
      throw error;


    if(!data)
      return;


    const state =
      normalizeState(
        data.state
      );


    if(
      state.round !==
      currentState.round
    ){

      currentState =
        state;


      renderGame();


      return;
    }


    /*
      Final round.
    */

    if(
      state.round >=
      TOTAL_ROUNDS
    ){

      await finishGame(
        state
      );

      return;
    }


    if(
      !state.roundFinished
    )
      return;


    /*
      Start next round.
    */

    state.round++;

    state.turn =
      "a";

    state.roundWinner =
      null;

    state.roundFinished =
      false;


    /*
      Reset round-only values.
      Keep total score.
    */

    for(
      const role of [
        "a",
        "b"
      ]
    ){

      state[role].secret =
        null;

      state[role].secretSet =
        false;

      state[role].guesses =
        [];

      state[role].roundPoints =
        0;
    }


    const {
      data:updated,
      error:updateError
    } =
      await supabaseClient
        .from("duels")
        .update({

          state,

          updated_at:
            new Date()
              .toISOString()

        })
        .eq(
          "code",
          roomCode
        )
        .select()
        .single();


    if(updateError)
      throw updateError;


    currentState =
      normalizeState(
        updated.state
      );


    transitionKey =
      "";


    renderGame();


  }catch(error){

    console.error(
      "NEXT ROUND ERROR:",
      error
    );


    showError(
      $("roundResult"),
      error,
      "Could not start next round"
    );
  }
}


/* =========================================================
   FINISH GAME
========================================================= */

async function finishGame(state){

  const a =
    state.a.totalPoints;


  const b =
    state.b.totalPoints;


  if(a === b){

    state.winner =
      "draw";

  }else{

    state.winner =
      a > b
        ? "a"
        : "b";
  }


  state.roundFinished =
    true;


  const {error} =
    await supabaseClient
      .from("duels")
      .update({

        state,

        updated_at:
          new Date()
            .toISOString()

      })
      .eq(
        "code",
        roomCode
      );


  if(error){

    showError(
      $("finalResult"),
      error,
      "Could not finish game"
    );

    return;
  }


  currentState =
    state;


  renderGame();
}
