<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Number Duel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(circle at top, #182447 0%, #080b16 45%, #05060b 100%);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      width: 100%;
      max-width: 900px;
      margin: auto;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .hero {
      text-align: center;
      padding: 35px 15px 25px;
    }

    .logo {
      font-size: clamp(38px, 8vw, 70px);
      font-weight: 900;
      letter-spacing: -3px;
    }

    .subtitle {
      margin-top: 10px;
      color: #aeb7d0;
      font-size: 15px;
    }

    .card {
      background: rgba(18, 24, 45, 0.9);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 22px;
      padding: 24px;
      margin-bottom: 18px;
      box-shadow: 0 15px 45px rgba(0,0,0,.25);
    }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }

    .mode-btn {
      min-height: 120px;
      border: 1px solid rgba(255,255,255,.08);
      background: #11172b;
      color: white;
      border-radius: 18px;
      cursor: pointer;
      padding: 20px;
      transition: .2s;
    }

    .mode-btn:hover {
      transform: translateY(-2px);
      border-color: #6e7cff;
    }

    .mode-btn.selected {
      background: #202957;
      border-color: #7885ff;
      box-shadow: 0 0 0 2px rgba(120,133,255,.18);
    }

    .mode-icon {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .mode-title {
      font-size: 19px;
      font-weight: 800;
    }

    .mode-description {
      color: #9ca6c0;
      font-size: 13px;
      margin-top: 5px;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button.primary,
    button.secondary {
      border: none;
      border-radius: 14px;
      padding: 14px 18px;
      cursor: pointer;
      font-weight: 800;
      transition: .2s;
    }

    button.primary {
      background: #6675ff;
      color: white;
    }

    button.primary:hover {
      background: #7885ff;
      transform: translateY(-1px);
    }

    button.secondary {
      background: #252c45;
      color: white;
    }

    button.secondary:hover {
      background: #303953;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none !important;
    }

    input {
      width: 100%;
      background: #0b1020;
      border: 1px solid #303955;
      color: white;
      border-radius: 13px;
      padding: 14px;
      outline: none;
      margin-top: 8px;
    }

    input:focus {
      border-color: #7280ff;
    }

    label {
      color: #c4cbe0;
      font-size: 14px;
      font-weight: 700;
    }

    .room-actions {
      display: grid;
      gap: 12px;
    }

    .hidden {
      display: none !important;
    }

    .error-box {
      background: rgba(220, 50, 70, .12);
      border: 1px solid rgba(255, 80, 100, .4);
      color: #ffb5be;
      border-radius: 14px;
      padding: 14px;
      margin-top: 15px;
      line-height: 1.5;
      font-size: 13px;
      word-break: break-word;
    }

    .error-title {
      font-weight: 900;
      color: #ff7d8c;
      margin-bottom: 5px;
    }

    .success-box {
      background: rgba(50, 200, 120, .1);
      border: 1px solid rgba(50, 200, 120, .3);
      color: #9ff0c4;
      border-radius: 14px;
      padding: 14px;
      margin-top: 15px;
    }

    .room-code {
      font-size: 35px;
      font-weight: 900;
      letter-spacing: 8px;
      text-align: center;
      padding: 15px;
      background: #0a0f1e;
      border-radius: 15px;
      margin: 12px 0;
    }

    .room-info {
      text-align: center;
      color: #9ca6c0;
      font-size: 13px;
    }

    .game-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
    }

    .player-score {
      background: #11172b;
      border-radius: 17px;
      padding: 15px;
      border: 1px solid rgba(255,255,255,.06);
    }

    .player-score.right {
      text-align: right;
    }

    .player-name {
      color: #9fa9c3;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .score {
      font-size: 30px;
      font-weight: 900;
      margin-top: 3px;
    }

    .round-label {
      text-align: center;
      background: #202750;
      border-radius: 14px;
      padding: 10px 15px;
      min-width: 100px;
    }

    .round-small {
      font-size: 11px;
      color: #aab3cf;
    }

    .round-number {
      font-size: 20px;
      font-weight: 900;
    }

    .status {
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .secret-box {
      text-align: center;
      background: #0a0f1e;
      border-radius: 17px;
      padding: 20px;
      margin-top: 15px;
    }

    .secret-title {
      color: #aab3ca;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .secret-set {
      font-size: 25px;
      font-weight: 900;
      color: #73e3a8;
    }

    .guess-form {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .guess-form input {
      margin: 0;
    }

    .guess-form button {
      min-width: 120px;
    }

    .history {
      margin-top: 20px;
    }

    .history-title {
      color: #aab3ca;
      font-size: 13px;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .guess-item {
      background: #0c1222;
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 13px;
      padding: 12px;
      margin-bottom: 8px;
    }

    .guess-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-weight: 800;
    }

    .guess-result {
      margin-top: 4px;
      color: #aab3ca;
      font-size: 13px;
    }

    .feedback-list {
      display: grid;
      gap: 7px;
      margin-top: 9px;
    }

    .feedback-digit {
      padding: 8px 10px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
    }

    .correct-position {
      background: rgba(60, 210, 130, .12);
      color: #82eeb1;
    }

    .wrong-position {
      background: rgba(245, 190, 60, .12);
      color: #ffd36b;
    }

    .not-found {
      background: rgba(255, 80, 90, .1);
      color: #ff9ca5;
    }

    .result-box {
      text-align: center;
      padding: 25px;
      border-radius: 18px;
      background: #151c35;
      margin-top: 18px;
    }

    .result-title {
      font-size: 25px;
      font-weight: 900;
    }

    .result-points {
      color: #aeb7d0;
      margin-top: 8px;
    }

    .winner-box {
      text-align: center;
      background: #171e38;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px;
      padding: 30px 20px;
      margin-top: 18px;
    }

    .winner-title {
      font-size: 30px;
      font-weight: 900;
    }

    .winner-score {
      font-size: 40px;
      font-weight: 900;
      margin-top: 8px;
    }

    .small-note {
      color: #8f99b4;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 10px;
    }

    .loading {
      text-align: center;
      padding: 15px;
      color: #aeb7d0;
    }

    @media (max-width: 650px) {
      .mode-grid,
      .button-row {
        grid-template-columns: 1fr;
      }

      .game-header {
        grid-template-columns: 1fr;
      }

      .player-score,
      .player-score.right {
        text-align: center;
      }

      .guess-form {
        flex-direction: column;
      }

      .guess-form button {
        width: 100%;
      }

      .room-code {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HOME -->
  <section id="homeScreen" class="screen active">

    <div class="hero">
      <div class="logo">NUMBER DUEL</div>
      <div class="subtitle">
        Challenge your opponent. Guess smart. Score more.
      </div>
    </div>

    <div class="card">

      <div class="mode-grid">

        <button class="mode-btn selected" id="duelModeBtn">
          <div class="mode-icon">🎯</div>
          <div class="mode-title">Duel</div>
          <div class="mode-description">
            Guess a number from 1–100
          </div>
        </button>

        <button class="mode-btn" id="crackModeBtn">
          <div class="mode-icon">🔐</div>
          <div class="mode-title">Crack</div>
          <div class="mode-description">
            Crack your opponent's 4-digit code
          </div>
        </button>

      </div>

      <div class="button-row">
        <button class="primary" id="createRoomBtn">
          Create Room
        </button>

        <button class="secondary" id="showJoinBtn">
          Join Room
        </button>
      </div>

      <div id="homeError"></div>

    </div>

    <div class="card hidden" id="joinCard">

      <label>
        Enter Room Code
      </label>

      <input
        id="joinCodeInput"
        maxlength="6"
        placeholder="ABC123"
        autocomplete="off"
      />

      <div style="height:12px"></div>

      <button class="primary" id="joinRoomBtn" style="width:100%">
        Join Room
      </button>

      <div id="joinError"></div>

    </div>

  </section>


  <!-- WAITING -->
  <section id="waitingScreen" class="screen">

    <div class="hero">
      <div class="logo" style="font-size:45px">
        ROOM READY
      </div>
      <div class="subtitle">
        Share this room code with your opponent
      </div>
    </div>

    <div class="card">

      <div class="room-info">
        ROOM CODE
      </div>

      <div id="createdRoomCode" class="room-code">
        ------
      </div>

      <div class="room-info">
        Waiting for opponent...
      </div>

      <div class="loading" id="waitingStatus">
        Checking room...
      </div>

      <button
        class="secondary"
        id="cancelRoomBtn"
        style="width:100%;margin-top:10px"
      >
        Leave Room
      </button>

    </div>

    <div id="waitingError"></div>

  </section>


  <!-- GAME -->
  <section id="gameScreen" class="screen">

    <div class="hero" style="padding-bottom:15px">
      <div class="logo" style="font-size:42px">
        NUMBER DUEL
      </div>
      <div class="subtitle">
        Room <span id="gameRoomCode"></span>
      </div>
    </div>

    <div class="game-header">

      <div class="player-score">
        <div class="player-name">You</div>
        <div class="score" id="myScore">0</div>
      </div>

      <div class="round-label">
        <div class="round-small">ROUND</div>
        <div class="round-number">
          <span id="roundNumber">1</span>/3
        </div>
      </div>

      <div class="player-score right">
        <div class="player-name">Opponent</div>
        <div class="score" id="opponentScore">0</div>
      </div>

    </div>

    <div class="card">

      <div class="status" id="gameStatus">
        Loading...
      </div>

      <!-- SECRET SETUP -->
      <div id="secretSection">

        <div class="secret-box">

          <div class="secret-title" id="secretInstruction">
            Set your secret number
          </div>

          <input
            id="secretInput"
            autocomplete="off"
            inputmode="numeric"
            placeholder="Enter your secret"
          />

          <button
            class="primary"
            id="setSecretBtn"
            style="width:100%;margin-top:12px"
          >
            Set Secret
          </button>

          <div id="secretMessage"></div>

        </div>

      </div>


      <!-- GUESS -->
      <div id="guessSection" class="hidden">

        <div class="secret-box">

          <div class="secret-title" id="guessInstruction">
            Enter your guess
          </div>

          <div class="guess-form">

            <input
              id="guessInput"
              autocomplete="off"
              inputmode="numeric"
              placeholder="Your guess"
            />

            <button class="primary" id="guessBtn">
              Guess
            </button>

          </div>

          <div id="guessError"></div>

        </div>

        <div class="history">

          <div class="history-title">
            Your Guess History
          </div>

          <div id="guessHistory"></div>

        </div>

      </div>


      <div id="roundResult"></div>

      <div id="finalResult"></div>

    </div>

    <button
      class="secondary"
      id="leaveGameBtn"
      style="width:100%"
    >
      Leave Game
    </button>

  </section>

</div>


<script>

  /* =========================================================
     SUPABASE CONFIG
     ========================================================= */

  const SUPABASE_URL =
    "https://uenyqkyuyxbbqehjzspk.supabase.co";

  /*
    IMPORTANT:
    Replace this with YOUR existing Supabase anon/publishable key.
  */

  const SUPABASE_KEY =
    "sb_publishable_FGT-Tw77u5BTy4zxbqwiHA_bmndBToE";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================================================
     GAME CONFIG
     ========================================================= */

  const TOTAL_ROUNDS = 3;

  const MAX_ROUND_POINTS = 100;

  const MIN_ROUND_POINTS = 10;


  /* =========================================================
     VARIABLES
     ========================================================= */

  let selectedMode = "duel";

  let roomCode = null;

  let myRole = null;

  let currentState = null;

  let realtimeChannel = null;

  let nextRoundTimer = null;

  let transitionKey = null;


  /* =========================================================
     DOM
     ========================================================= */

  const homeScreen =
    document.getElementById("homeScreen");

  const waitingScreen =
    document.getElementById("waitingScreen");

  const gameScreen =
    document.getElementById("gameScreen");

  const homeError =
    document.getElementById("homeError");

  const joinCard =
    document.getElementById("joinCard");

  const joinError =
    document.getElementById("joinError");

  const waitingError =
    document.getElementById("waitingError");

  const secretMessage =
    document.getElementById("secretMessage");

  const guessError =
    document.getElementById("guessError");


  /* =========================================================
     HELPERS
     ========================================================= */

  function showScreen(screen) {

    homeScreen.classList.remove("active");
    waitingScreen.classList.remove("active");
    gameScreen.classList.remove("active");

    screen.classList.add("active");
  }


  function showError(container, error, title = "Supabase Error") {

    if (!container) return;

    let message = "Unknown error.";

    if (typeof error === "string") {

      message = error;

    } else if (error) {

      const parts = [];

      if (error.message) {
        parts.push(`Message: ${error.message}`);
      }

      if (error.details) {
        parts.push(`Details: ${error.details}`);
      }

      if (error.hint) {
        parts.push(`Hint: ${error.hint}`);
      }

      if (error.code) {
        parts.push(`Code: ${error.code}`);
      }

      message =
        parts.length
          ? parts.join("<br>")
          : JSON.stringify(error);
    }

    container.innerHTML = `
      <div class="error-box">
        <div class="error-title">
          ⚠️ ${escapeHtml(title)}
        </div>

        <div>
          ${message}
        </div>
      </div>
    `;
  }


  function clearError(container) {

    if (container) {
      container.innerHTML = "";
    }
  }


  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  function generateRoomCode() {

    const chars =
      "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let result = "";

    for (let i = 0; i < 6; i++) {

      result +=
        chars[
          Math.floor(
            Math.random() * chars.length
          )
        ];
    }

    return result;
  }


  function createPlayerState() {

    return {

      secret: null,

      secretSet: false,

      guesses: [],

      roundPoints: 0,

      totalPoints: 0

    };
  }


  function createInitialState(mode) {

    return {

      mode,

      status: "waiting_for_join",

      round: 1,

      totalRounds: TOTAL_ROUNDS,

      turn: "a",

      winner: null,

      roundWinner: null,

      roundFinished: false,

      a: createPlayerState(),

      b: createPlayerState()

    };
  }


  function normalizePlayerState(player) {

    return {

      secret:
        player?.secret ?? null,

      secretSet:
        !!player?.secretSet,

      guesses:
        Array.isArray(player?.guesses)
          ? player.guesses
          : [],

      roundPoints:
        Number(player?.roundPoints || 0),

      totalPoints:
        Number(player?.totalPoints || 0)

    };
  }


  function normalizeState(state) {

    state.a =
      normalizePlayerState(state.a);

    state.b =
      normalizePlayerState(state.b);

    state.round =
      Number(state.round || 1);

    state.totalRounds =
      Number(state.totalRounds || TOTAL_ROUNDS);

    state.turn =
      state.turn || "a";

    state.roundFinished =
      !!state.roundFinished;

    return state;
  }


  function calculatePoints(guessCount) {

    return Math.max(
      MIN_ROUND_POINTS,
      MAX_ROUND_POINTS -
      ((guessCount - 1) * 10)
    );
  }


  /* =========================================================
     MODE SELECTION
     ========================================================= */

  document
    .getElementById("duelModeBtn")
    .addEventListener("click", () => {

      selectedMode = "duel";

      document
        .getElementById("duelModeBtn")
        .classList.add("selected");

      document
        .getElementById("crackModeBtn")
        .classList.remove("selected");

    });


  document
    .getElementById("crackModeBtn")
    .addEventListener("click", () => {

      selectedMode = "crack";

      document
        .getElementById("crackModeBtn")
        .classList.remove("selected");

      document
        .getElementById("duelModeBtn")
        .classList.add("selected");

    });


  document
    .getElementById("showJoinBtn")
    .addEventListener("click", () => {

      joinCard.classList.toggle("hidden");

      clearError(homeError);

    });


  /* =========================================================
     CREATE ROOM
     ========================================================= */

  document
    .getElementById("createRoomBtn")
    .addEventListener("click", createRoom);


  async function createRoom() {

    clearError(homeError);

    const button =
      document.getElementById("createRoomBtn");

    button.disabled = true;

    button.textContent =
      "Creating...";


    try {

      if (
        !SUPABASE_URL ||
        !SUPABASE_KEY ||
        SUPABASE_KEY === "YOUR_SUPABASE_ANON_KEY"
      ) {

        throw new Error(
          "Supabase key is missing. Replace YOUR_SUPABASE_ANON_KEY with your existing anon/publishable key."
        );
      }


      roomCode =
        generateRoomCode();


      currentState =
        createInitialState(selectedMode);


      /*
        First check whether the generated code already exists.
      */

      const { data: existingRoom, error: checkError } =
        await supabaseClient
          .from("duels")
          .select("code")
          .eq("code", roomCode)
          .maybeSingle();


      if (checkError) {

        throw checkError;
      }


      /*
        Extremely unlikely collision.
      */

      if (existingRoom) {

        roomCode =
          generateRoomCode();
      }


      /*
        INSERT ROOM
      */

      const { data, error } =
        await supabaseClient
          .from("duels")
          .insert({

            code: roomCode,

            state: currentState

          })
          .select()
          .single();


      if (error) {

        console.error(
          "CREATE ROOM SUPABASE ERROR:",
          error
        );

        throw error;
      }


      console.log(
        "ROOM CREATED:",
        data
      );


      myRole = "a";


      document
        .getElementById("createdRoomCode")
        .textContent = roomCode;


      document
        .getElementById("waitingStatus")
        .textContent =
        "Waiting for opponent...";


      showScreen(waitingScreen);


      subscribeToRoom();

    } catch (error) {

      console.error(
        "CREATE ROOM FAILED:",
        error
      );

      showError(
        homeError,
        error,
        "Could not create room"
      );

    } finally {

      button.disabled = false;

      button.textContent =
        "Create Room";
    }
  }


  /* =========================================================
     JOIN ROOM
     ========================================================= */

  document
    .getElementById("joinRoomBtn")
    .addEventListener("click", joinRoom);


  async function joinRoom() {

    clearError(joinError);

    const button =
      document.getElementById("joinRoomBtn");

    const input =
      document.getElementById("joinCodeInput");

    const code =
      input.value.trim().toUpperCase();


    if (code.length !== 6) {

      showError(
        joinError,
        "Room code must contain exactly 6 characters.",
        "Invalid Room Code"
      );

      return;
    }


    button.disabled = true;

    button.textContent =
      "Joining...";


    try {

      const { data, error } =
        await supabaseClient
          .from("duels")
          .select("*")
          .eq("code", code)
          .maybeSingle();


      if (error) {

        console.error(
          "JOIN LOOKUP ERROR:",
          error
        );

        throw error;
      }


      if (!data) {

        throw new Error(
          "Room not found. Check the room code and try again."
        );
      }


      currentState =
        normalizeState(data.state);


      /*
        Room already has two players.
      */

      if (currentState.b?.joined) {

        throw new Error(
          "This room already has two players."
        );
      }


      /*
        Mark player B as joined.
      */

      currentState.b.joined = true;

      currentState.status =
        "playing";


      const { data: updatedData, error: updateError } =
        await supabaseClient
          .from("duels")
          .update({

            state: currentState

          })
          .eq("code", code)
          .select()
          .single();


      if (updateError) {

        console.error(
          "JOIN UPDATE ERROR:",
          updateError
        );

        throw updateError;
      }


      roomCode = code;

      myRole = "b";

      currentState =
        normalizeState(updatedData.state);


      document
        .getElementById("gameRoomCode")
        .textContent = roomCode;


      showScreen(gameScreen);


      subscribeToRoom();

      renderGame();


    } catch (error) {

      console.error(
        "JOIN ROOM FAILED:",
        error
      );

      showError(
        joinError,
        error,
        "Could not join room"
      );

    } finally {

      button.disabled = false;

      button.textContent =
        "Join Room";
    }
  }


  /* =========================================================
     REALTIME
     ========================================================= */

  function subscribeToRoom() {

    if (realtimeChannel) {

      supabaseClient
        .removeChannel(realtimeChannel);
    }


    realtimeChannel =
      supabaseClient
        .channel(`duel-${roomCode}`)

        .on(
          "postgres_changes",
          {
            event: "*",
            schema: "public",
            table: "duels",
            filter: `code=eq.${roomCode}`
          },
          payload => {

            console.log(
              "REALTIME UPDATE:",
              payload
            );


            if (
              payload.new &&
              payload.new.state
            ) {

              currentState =
                normalizeState(
                  payload.new.state
                );


              if (
                currentState.status === "playing" ||
                currentState.round > 1
              ) {

                document
                  .getElementById("gameRoomCode")
                  .textContent =
                  roomCode;

                showScreen(gameScreen);

                renderGame();

              } else {

                renderWaiting();
              }
            }

          }
        )

        .subscribe(status => {

          console.log(
            "REALTIME STATUS:",
            status
          );

          if (
            status === "CHANNEL_ERROR"
          ) {

            showError(
              waitingError,
              "Realtime subscription failed. Check whether Realtime is enabled for the duels table.",
              "Realtime Error"
            );
          }

        });
  }


  /* =========================================================
     WAITING
     ========================================================= */

  function renderWaiting() {

    document
      .getElementById("waitingStatus")
      .textContent =
      currentState?.status === "playing"
        ? "Opponent joined!"
        : "Waiting for opponent...";


    if (
      currentState?.status === "playing"
    ) {

      document
        .getElementById("gameRoomCode")
        .textContent =
        roomCode;

      showScreen(gameScreen);

      renderGame();
    }
  }


  /* =========================================================
     SECRET
     ========================================================= */

  document
    .getElementById("setSecretBtn")
    .addEventListener("click", setSecret);


  async function setSecret() {

    clearError(secretMessage);

    const input =
      document.getElementById("secretInput");

    const raw =
      input.value.trim();


    if (!validateSecret(raw)) {

      return;
    }


    const player =
      currentState[myRole];


    if (player.secretSet) {

      showError(
        secretMessage,
        "You already set your secret for this round.",
        "Secret Already Set"
      );

      return;
    }


    player.secret =
      raw;

    player.secretSet =
      true;


    /*
      Start round when both players
      have selected their secrets.
    */

    if (
      currentState.a.secretSet &&
      currentState.b.secretSet
    ) {

      currentState.status =
        "playing";

      currentState.turn =
        "a";
    }


    await saveState();

  }


  function validateSecret(raw) {

    if (selectedMode === "duel") {

      const number =
        Number(raw);

      if (
        !Number.isInteger(number) ||
        number < 1 ||
        number > 100
      ) {

        showError(
          secretMessage,
          "For Duel, enter a whole number from 1 to 100.",
          "Invalid Secret"
        );

        return false;
      }

      return true;
    }


    /*
      CRACK
    */

    if (!/^\d{4}$/.test(raw)) {

      showError(
        secretMessage,
        "For Crack, enter exactly 4 digits.",
        "Invalid Secret"
      );

      return false;
    }


    if (
      new Set(raw.split("")).size !== 4
    ) {

      showError(
        secretMessage,
        "All 4 digits must be unique.",
        "Invalid Secret"
      );

      return false;
    }


    return true;
  }


  /* =========================================================
     GUESS
     ========================================================= */

  document
    .getElementById("guessBtn")
    .addEventListener("click", makeGuess);


  async function makeGuess() {

    clearError(guessError);

    if (!currentState) return;


    if (
      currentState.roundFinished
    ) {

      return;
    }


    if (
      currentState.turn !== myRole
    ) {

      showError(
        guessError,
        "It is not your turn.",
        "Wait for Opponent"
      );

      return;
    }


    const input =
      document.getElementById("guessInput");

    const raw =
      input.value.trim();


    if (!validateGuess(raw)) {

      return;
    }


    const mine =
      currentState[myRole];

    const opponentRole =
      myRole === "a"
        ? "b"
        : "a";

    const opponent =
      currentState[opponentRole];


    /*
      Prevent duplicate guesses.
    */

    if (
      mine.guesses.some(
        guess => guess.value === raw
      )
    ) {

      showError(
        guessError,
        "You already made this guess.",
        "Duplicate Guess"
      );

      return;
    }


    /*
      DUEL
    */

    if (currentState.mode === "duel") {

      mine.guesses.push({
        value: raw
      });


      const guess =
        Number(raw);

      const secret =
        Number(opponent.secret);


      if (guess === secret) {

        const points =
          calculatePoints(
            mine.guesses.length
          );

        mine.roundPoints =
          points;

        mine.totalPoints +=
          points;


        currentState.roundWinner =
          myRole;

        currentState.roundFinished =
          true;


      } else {

        currentState.turn =
          opponentRole;
      }


      input.value = "";

      await saveState();

      return;
    }


    /*
      CRACK
    */

    const result =
      scoreCrackGuess(
        raw,
        opponent.secret
      );


    mine.guesses.push({

      value: raw,

      bulls: result.bulls,

      cows: result.cows,

      details: result.details

    });


    if (
      result.bulls === 4
    ) {

      const points =
        calculatePoints(
          mine.guesses.length
        );

      mine.roundPoints =
        points;

      mine.totalPoints +=
        points;


      currentState.roundWinner =
        myRole;

      currentState.roundFinished =
        true;

    } else {

      currentState.turn =
        opponentRole;
    }


    input.value = "";

    await saveState();

  }


  function validateGuess(raw) {

    if (
      currentState.mode === "duel"
    ) {

      const number =
        Number(raw);

      if (
        !Number.isInteger(number) ||
        number < 1 ||
        number > 100
      ) {

        showError(
          guessError,
          "Enter a whole number from 1 to 100.",
          "Invalid Guess"
        );

        return false;
      }

      return true;
    }


    if (!/^\d{4}$/.test(raw)) {

      showError(
        guessError,
        "Enter exactly 4 digits.",
        "Invalid Guess"
      );

      return false;
    }


    if (
      new Set(raw.split("")).size !== 4
    ) {

      showError(
        guessError,
        "All 4 digits in a Crack guess must be unique.",
        "Invalid Guess"
      );

      return false;
    }


    return true;
  }


  /* =========================================================
     CRACK LOGIC
     ========================================================= */

  function scoreCrackGuess(
    guess,
    secret
  ) {

    let bulls = 0;

    let cows = 0;

    const details = [];


    for (let i = 0; i < 4; i++) {

      const digit =
        guess[i];


      if (
        digit === secret[i]
      ) {

        bulls++;

        details.push({

          digit,

          position: i + 1,

          status:
            "correct-position"

        });

      } else if (
        secret.includes(digit)
      ) {

        cows++;

        details.push({

          digit,

          position: i + 1,

          status:
            "correct-wrong-position"

        });

      } else {

        details.push({

          digit,

          position: i + 1,

          status:
            "not-in-code"

        });
      }
    }


    return {
      bulls,
      cows,
      details
    };
  }


  /* =========================================================
     SAVE STATE
     ========================================================= */

  async function saveState() {

    try {

      const { error } =
        await supabaseClient
          .from("duels")
          .update({

            state: currentState,

            updated_at:
              new Date().toISOString()

          })
          .eq("code", roomCode);


      if (error) {

        console.error(
          "SAVE STATE ERROR:",
          error
        );

        throw error;
      }


      renderGame();

    } catch (error) {

      console.error(
        "SAVE STATE FAILED:",
        error
      );


      showError(
        guessError,
        error,
        "Could not update game"
      );
    }
  }


  /* =========================================================
     RENDER GAME
     ========================================================= */

  function renderGame() {

    if (!currentState) return;


    currentState =
      normalizeState(currentState);


    document
      .getElementById("gameRoomCode")
      .textContent =
      roomCode;


    document
      .getElementById("roundNumber")
      .textContent =
      currentState.round;


    const mine =
      currentState[myRole];

    const opponent =
      currentState[
        myRole === "a" ? "b" : "a"
      ];


    document
      .getElementById("myScore")
      .textContent =
      mine.totalPoints;


    document
      .getElementById("opponentScore")
      .textContent =
      opponent.totalPoints;


    const status =
      document.getElementById(
        "gameStatus"
      );


    const secretSection =
      document.getElementById(
        "secretSection"
      );

    const guessSection =
      document.getElementById(
        "guessSection"
      );


    /*
      FINAL GAME
    */

    if (currentState.winner) {

      secretSection.classList.add(
        "hidden"
      );

      guessSection.classList.add(
        "hidden"
      );

      renderFinalResult();

      return;
    }


    /*
      ROUND FINISHED
    */

    if (
      currentState.roundFinished
    ) {

      secretSection.classList.add(
        "hidden"
      );

      guessSection.classList.add(
        "hidden"
      );

      renderRoundResult();

      scheduleNextRound();

      return;
    }


    /*
      Waiting for both secrets.
    */

    if (
      !currentState.a.secretSet ||
      !currentState.b.secretSet
    ) {

      guessSection.classList.add(
        "hidden"
      );

      secretSection.classList.remove(
        "hidden"
      );


      if (mine.secretSet) {

        document
          .getElementById("secretInput")
          .disabled = true;

        document
          .getElementById("setSecretBtn")
          .disabled = true;


        status.textContent =
          "Secret saved. Waiting for opponent...";


        document
          .getElementById("secretMessage")
          .innerHTML = `
            <div class="success-box">
              ✓ Your secret is locked in.
            </div>
          `;

      } else {

        document
          .getElementById("secretInput")
          .disabled = false;

        document
          .getElementById("setSecretBtn")
          .disabled = false;


        status.textContent =
          currentState.mode === "duel"
            ? "Choose your secret number."
            : "Choose your secret 4-digit code.";

      }


      return;
    }


    /*
      Both secrets set.
    */

    secretSection.classList.add(
      "hidden"
    );

    guessSection.classList.remove(
      "hidden"
    );


    /*
      Turn.
    */

    if (
      currentState.turn === myRole
    ) {

      status.textContent =
        "🔥 Your turn";

      document
        .getElementById("guessInput")
        .disabled = false;

      document
        .getElementById("guessBtn")
        .disabled = false;

    } else {

      status.textContent =
        "⏳ Opponent's turn";

      document
        .getElementById("guessInput")
        .disabled = true;

      document
        .getElementById("guessBtn")
        .disabled = true;
    }


    document
      .getElementById("guessInstruction")
      .textContent =
      currentState.mode === "duel"
        ? "Guess opponent's number (1–100)"
        : "Crack opponent's 4-digit code";


    renderGuessHistory(
      document.getElementById(
        "guessHistory"
      ),
      mine.guesses
    );
  }


  /* =========================================================
     GUESS HISTORY
     ========================================================= */

  function renderGuessHistory(
    container,
    guesses
  ) {

    if (!guesses.length) {

      container.innerHTML = `
        <div class="small-note">
          Your guesses will appear here.
        </div>
      `;

      return;
    }


    /*
      IMPORTANT:
      ONLY YOUR guesses are rendered.
      Opponent guesses remain hidden.
    */

    container.innerHTML =
      guesses
        .slice()
        .reverse()
        .map((guess, index) => {

          if (
            currentState.mode === "duel"
          ) {

            const opponentRole =
              myRole === "a"
                ? "b"
                : "a";

            const secret =
              Number(
                currentState[
                  opponentRole
                ].secret
              );

            const value =
              Number(guess.value);


            let result = "";

            if (value < secret) {

              result =
                "📈 Too low";

            } else if (
              value > secret
            ) {

              result =
                "📉 Too high";

            } else {

              result =
                "🎯 Correct";
            }


            return `
              <div class="guess-item">

                <div class="guess-top">
                  <span>
                    Guess #${
                      guesses.length - index
                    }
                  </span>

                  <strong>
                    ${escapeHtml(
                      guess.value
                    )}
                  </strong>
                </div>

                <div class="guess-result">
                  ${result}
                </div>

              </div>
            `;

          }


          const details =
            Array.isArray(
              guess.details
            )
              ? guess.details
              : [];


          return `
            <div class="guess-item">

              <div class="guess-top">

                <span>
                  Guess #${
                    guesses.length - index
                  }
                </span>

                <strong>
                  ${escapeHtml(
                    guess.value
                  )}
                </strong>

              </div>

              <div class="guess-result">
                ${guess.bulls} correct position
                •
                ${guess.cows} correct digit, wrong position
              </div>

              <div class="feedback-list">

                ${
                  details.map(item => {

                    if (
                      item.status ===
                      "correct-position"
                    ) {

                      return `
                        <div class="feedback-digit correct-position">
                          ${escapeHtml(item.digit)}
                          ✓ Correct digit • Correct position
                        </div>
                      `;

                    }


                    if (
                      item.status ===
                      "correct-wrong-position"
                    ) {

                      return `
                        <div class="feedback-digit wrong-position">
                          ${escapeHtml(item.digit)}
                          ✓ Correct digit • Wrong position
                        </div>
                      `;

                    }


                    return `
                      <div class="feedback-digit not-found">
                        ${escapeHtml(item.digit)}
                        ✕ Not in code
                      </div>
                    `;

                  }).join("")
                }

              </div>

            </div>
          `;

        })
        .join("");
  }


  /* =========================================================
     ROUND RESULT
     ========================================================= */

  function renderRoundResult() {

    const box =
      document.getElementById(
        "roundResult"
      );


    const winner =
      currentState.roundWinner;


    const points =
      currentState[
        winner
      ].roundPoints;


    let title;


    if (winner === myRole) {

      title =
        "🎉 You won the round!";

    } else {

      title =
        "😮 Opponent won the round";

    }


    box.innerHTML = `
      <div class="result-box">

        <div class="result-title">
          ${title}
        </div>

        <div class="result-points">
          ${points} points earned by
          ${
            winner === myRole
              ? "you"
              : "your opponent"
          }
        </div>

      </div>
    `;
  }


  /* =========================================================
     NEXT ROUND
     ========================================================= */

  function scheduleNextRound() {

    const key =
      `${currentState.round}-${currentState.roundWinner}`;


    if (
      transitionKey === key
    ) {

      return;
    }


    transitionKey = key;


    if (nextRoundTimer) {

      clearTimeout(
        nextRoundTimer
      );
    }


    nextRoundTimer =
      setTimeout(
        startNextRound,
        3500
      );
  }


  async function startNextRound() {

    try {

      /*
        Re-fetch the latest state before
        changing the round.
      */

      const { data, error } =
        await supabaseClient
          .from("duels")
          .select("*")
          .eq("code", roomCode)
          .maybeSingle();


      if (error) {

        throw error;
      }


      if (!data) return;


      const latest =
        normalizeState(
          data.state
        );


      /*
        Someone already moved the game
        forward.
      */

      if (
        latest.round !== currentState.round
      ) {

        currentState =
          latest;

        renderGame();

        return;
      }


      /*
        Final round.
      */

      if (
        latest.round >= TOTAL_ROUNDS
      ) {

        finishGame(
          latest
        );

        return;
      }


      if (
        !latest.roundFinished
      ) {

        return;
      }


      latest.round++;

      latest.turn =
        "a";

      latest.roundWinner =
        null;

      latest.roundFinished =
        false;

      latest.a.secret =
        null;

      latest.a.secretSet =
        false;

      latest.a.guesses =
        [];

      latest.a.roundPoints =
        0;

      latest.b.secret =
        null;

      latest.b.secretSet =
        false;

      latest.b.guesses =
        [];

      latest.b.roundPoints =
        0;


      const {
        data: updated,
        error: updateError
      } =
        await supabaseClient
          .from("duels")
          .update({

            state: latest,

            updated_at:
              new Date().toISOString()

          })
          .eq("code", roomCode)
          .select()
          .single();


      if (updateError) {

        throw updateError;
      }


      currentState =
        normalizeState(
          updated.state
        );


      transitionKey =
        null;


      renderGame();


    } catch (error) {

      console.error(
        "NEXT ROUND ERROR:",
        error
      );

      showError(
        document.getElementById(
          "roundResult"
        ),
        error,
        "Could not start next round"
      );
    }
  }


  /* =========================================================
     FINISH GAME
     ========================================================= */

  async function finishGame(state) {

    const aScore =
      state.a.totalPoints;

    const bScore =
      state.b.totalPoints;


    if (aScore === bScore) {

      state.winner =
        "draw";

    } else {

      state.winner =
        aScore > bScore
          ? "a"
          : "b";
    }


    state.roundFinished =
      true;


    try {

      const { error } =
        await supabaseClient
          .from("duels")
          .update({

            state,

            updated_at:
              new Date().toISOString()

          })
          .eq("code", roomCode);


      if (error) {

        throw error;
      }


      currentState =
        state;

      renderGame();

    } catch (error) {

      console.error(
        "FINISH GAME ERROR:",
        error
      );

      showError(
        document.getElementById(
          "finalResult"
        ),
        error,
        "Could not finish game"
      );
    }
  }


  /* =========================================================
     FINAL RESULT
     ========================================================= */

  function renderFinalResult() {

    const box =
      document.getElementById(
        "finalResult"
      );


    const aScore =
      currentState.a.totalPoints;

    const bScore =
      currentState.b.totalPoints;


    if (
      currentState.winner === "draw"
    ) {

      box.innerHTML = `
        <div class="winner-box">

          <div class="winner-title">
            🤝 Game Draw
          </div>

          <div class="winner-score">
            ${aScore} - ${bScore}
          </div>

          <div class="result-points">
            Both players finished with the same score.
          </div>

        </div>
      `;

      return;
    }


    if (
      currentState.winner === myRole
    ) {

      box.innerHTML = `
        <div class="winner-box">

          <div class="winner-title">
            🏆 You Won!
          </div>

          <div class="winner-score">
            ${aScore} - ${bScore}
          </div>

        </div>
      `;

    } else {

      box.innerHTML = `
        <div class="winner-box">

          <div class="winner-title">
            😮 Opponent Won
          </div>

          <div class="winner-score">
            ${aScore} - ${bScore}
          </div>

        </div>
      `;
    }
  }


  /* =========================================================
     LEAVE GAME
     ========================================================= */

  document
    .getElementById("cancelRoomBtn")
    .addEventListener(
      "click",
      leaveGame
    );


  document
    .getElementById("leaveGameBtn")
    .addEventListener(
      "click",
      leaveGame
    );


  async function leaveGame() {

    if (realtimeChannel) {

      await supabaseClient
        .removeChannel(
          realtimeChannel
        );

      realtimeChannel =
        null;
    }


    if (nextRoundTimer) {

      clearTimeout(
        nextRoundTimer
      );

      nextRoundTimer =
        null;
    }


    roomCode = null;

    myRole = null;

    currentState = null;

    transitionKey = null;


    document
      .getElementById("joinCodeInput")
      .value = "";

    document
      .getElementById("secretInput")
      .value = "";

    document
      .getElementById("guessInput")
      .value = "";


    clearError(homeError);

    clearError(joinError);

    clearError(waitingError);

    showScreen(homeScreen);
  }


  /* =========================================================
     KEYBOARD ENTER
     ========================================================= */

  document
    .getElementById("secretInput")
    .addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          setSecret();
        }
      }
    );


  document
    .getElementById("guessInput")
    .addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          makeGuess();
        }
      }
    );


  document
    .getElementById("joinCodeInput")
    .addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          joinRoom();
        }
      }
    );


  /* =========================================================
     STARTUP TEST
     ========================================================= */

  console.log(
    "Number Duel loaded."
  );

  console.log(
    "Supabase URL:",
    SUPABASE_URL
  );

</script>
